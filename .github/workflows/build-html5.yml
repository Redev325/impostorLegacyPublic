name: Build HTML5 Web Port
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            pkg-config \
            libwayland-dev \
            libwayland-bin \
            wayland-protocols \
            libasound2-dev \
            libpulse-dev \
            libdbus-1-dev \
            libudev-dev \
            libx11-dev \
            libxext-dev \
            libxrandr-dev \
            libxinerama-dev \
            libxcursor-dev \
            libxi-dev \
            libxfixes-dev \
            libxxf86vm-dev \
            libxss-dev \
            libxkbcommon-dev \
            libxt-dev \
            libxv-dev \
            libdrm-dev \
            libgbm-dev \
            libgl-dev \
            libgles-dev \
            libegl1-mesa-dev \
            libglu1-mesa-dev \
            libibus-1.0-dev \
            libsamplerate0-dev \
            libsndio-dev \
            libpipewire-0.3-dev \
            libspa-0.2-dev \
            libsdl2-dev

      - name: Setup Haxe Environment
        uses: krdlab/setup-haxe@v1
        with:
          haxe-version: 4.3.6

      - name: Install hxpkg
        run: haxelib install hxpkg --quiet

      - name: Install Project Libraries
        run: |
          haxelib run hxpkg setup
          haxelib run hxpkg install

      - name: Build Lime native tools
        run: |
          cd .haxelib/lime/git
          git submodule sync --recursive
          git submodule update --init --recursive --force
          cd ../../..
          haxelib run lime rebuild cpp -release

      - name: Compile to Web Port
        run: haxelib run lime build html5

      - name: Upload HTML5 Build
        uses: actions/upload-artifact@v4
        with:
          name: impostor-legacy-html5
          path: export/html5/bin
          if-no-files-found: error
          retention-days: 7
