name: Build HTML5 Web Port
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential pkg-config libwayland-dev libwayland-bin wayland-protocols \
            libasound2-dev libpulse-dev libdbus-1-dev libudev-dev \
            libx11-dev libxext-dev libxrandr-dev libxinerama-dev libxcursor-dev \
            libxi-dev libxfixes-dev libxxf86vm-dev libxss-dev libxkbcommon-dev \
            libxt-dev libxv-dev libdrm-dev libgbm-dev libgl-dev libgles-dev \
            libegl1-mesa-dev libglu1-mesa-dev libibus-1.0-dev libsamplerate0-dev \
            libsndio-dev libpipewire-0.3-dev libspa-0.2-dev libsdl2-dev

      - name: Setup Haxe Environment
        uses: krdlab/setup-haxe@v1
        with:
          haxe-version: 4.3.6

      - name: Install hxpkg
        run: haxelib install hxpkg --quiet

      - name: Install Project Libraries
        run: |
          haxelib run hxpkg setup
          haxelib run hxpkg install

      - name: Build Lime native tools
        run: |
          cd .haxelib/lime/git
          git submodule sync --recursive
          git submodule update --init --recursive --force
          cd ../../..
          haxelib run lime rebuild cpp -release

      - name: Disable native-only video backend for HTML5
        run: |
          cat > source/funkin/video/FunkinVideoSprite.hx <<'EOF'
          package funkin.video;
          import flixel.FlxSprite;
          class FunkinVideoSprite extends FlxSprite
          {
            public static final looping:String = ':input-repeat=65535';
            public static final muted:String = ':no-audio';
            public var tiedToGame:Bool = true;
            public var time(get, set):Float;
            public var length(get, never):Float;
            public var playing(get, never):Bool;
            public var percent(get, never):Float;
            var _time:Float = 0;
            var _playing:Bool = false;
            public function new(x:Float = 0, y:Float = 0, oneTimeUse:Bool = true) super(x, y);
            public static function init():Void {}
            public function delayAndStart(delay:Float = 0):Void {}
            public function onEnd(func:Void->Void, once:Bool = false, priority:Int = 0):Void {}
            public function onStart(func:Void->Void, once:Bool = false, priority:Int = 0):Void {}
            public function onFormat(func:Void->Void, once:Bool = false, priority:Int = 0):Void {}
            public function load(location:Dynamic, ?options:Array<String>):Bool return false;
            public function play():Void _playing = false;
            public function pause():Void _playing = false;
            public function resume():Void _playing = false;
            public function stop():Void _playing = false;
            inline function get_time():Float return _time;
            inline function set_time(value:Float):Float { _time = value; return value; }
            inline function get_length():Float return 0;
            inline function get_playing():Bool return _playing;
            inline function get_percent():Float return 0;
          }
          EOF

      - name: Apply HTML5 compatibility patches
        run: |
          python3 <<'PY'
          from pathlib import Path
          import re

          def edit(path, fn):
              p = Path(path)
              s = p.read_text()
              out = fn(s)
              if out == s:
                  raise SystemExit(f'No change made to {path}; expected source pattern was not found')
              p.write_text(out)

          edit('source/funkin/Paths.hx', lambda s: s
              .replace("\tpublic static function getModFolder(path:String, ?exclude:String):String\n", "\t#if html5\n\tpublic static inline function mods(?mod:String = ''):String\n\t{\n\t\treturn MODS_DIRECTORY + '/' + (mod ?? '');\n\t}\n\t#end\n\n\tpublic static function getModFolder(path:String, ?exclude:String):String\n", 1)
              .replace("return (!FileSystem.exists(path) && Assets.exists(path, FONT) ? Assets.getFont(path).fontName : path);", "return (Assets.exists(path, FONT) ? Assets.getFont(path).fontName : path);", 1))

          edit('source/funkin/data/CosmicubeData.hx', lambda s: s
              .replace("\tpublic static function reload(hard:Bool = true):Void\n\t{\n", "\tpublic static function reload(hard:Bool = true):Void\n\t{\n\t\t#if html5\n\t\treturn;\n\t\t#else\n", 1)
              .replace("\t}\n\t\n\tstatic function getShopItems", "\t\t#end\n\t}\n\t\n\tstatic function getShopItems", 1)
              .replace("\tstatic function getShopItems(dir:String, meta:CosmicubeMetadata):Array<ShopItemData>\n\t{\n", "\tstatic function getShopItems(dir:String, meta:CosmicubeMetadata):Array<ShopItemData>\n\t{\n\t\t#if html5\n\t\treturn [];\n\t\t#else\n", 1)
              .replace("\t\treturn list;\n\t}\n\n\tinline static function get_currentMeta", "\t\treturn list;\n\t\t#end\n\t}\n\n\tinline static function get_currentMeta", 1))

          edit('source/funkin/states/editors/ChartEditorState.hx', lambda s: s
              .replace('import openfl.events.Event;\n', 'import openfl.events.Event;\nimport openfl.media.Sound;\n', 1)
              .replace("File.getContent(Paths.getCorePath('$path.txt'))", "FunkinAssets.getContent(Paths.getCorePath('$path.txt'))", 1))

          Path('source/funkin/utils/FileUtil.hx').write_text('''package funkin.utils;\nimport openfl.net.FileFilter;\ntypedef BrowseOptions = { var ?typeFilter:Array<FileFilter>; var ?title:String; var ?defaultSearch:String; }\n@:nullSafety class FileUtil\n{\n  public static function browseForFile(options:BrowseOptions, ?onSelect:String->Void, ?onCancel:Void->Void):Void { if (onCancel != null) onCancel(); }\n  public static function browseForMultipleFiles(options:BrowseOptions, ?onSelect:Array<String>->Void, ?onCancel:Void->Void):Void { if (onCancel != null) onCancel(); }\n  public static function saveFile(data:Dynamic, ?fileName:String, ?onSelect:String->Void, ?onCancel:Void->Void):Void { if (onCancel != null) onCancel(); }\n  public static function saveFileToPath(data:Dynamic, path:String, ensureDirectory:Bool = true):Bool return false;\n}\n''')

          edit('source/funkin/data/ClientPrefs.hx', lambda s: s.replace('FileSystem.exists(', 'FunkinAssets.exists('))

          # Discord RPC is unavailable in HTML5, so remove these native calls from
          # the temporary web-build copy instead of inserting conditional directives
          # inside functions.
          edit('source/funkin/data/ClientPrefs.hx', lambda s: s.replace('funkin.api.DiscordClient.check();', '// Discord RPC disabled for HTML5'))
          edit('source/Init.hx', lambda s: s.replace('DiscordClient.check();', '// Discord RPC disabled for HTML5'))

          edit('source/funkin/utils/CoolUtil.hx', lambda s: s.replace('FlxG.error("Platform is not supported for CoolUtil.openFolder");', 'trace("Platform is not supported for CoolUtil.openFolder");'))

          edit('source/funkin/Mods.hx', lambda s: s
              .replace("File.saveContent('modsList.txt', '');", "#if !html5\n\t\t\tFile.saveContent('modsList.txt', '');\n\t\t\t#end", 1)
              .replace('FileSystem.exists(path + fileToFind)', 'FunkinAssets.exists(path + fileToFind)', 1))

          edit('source/Splash.hx', lambda s: s.replace("\tfunction logoFunc()\n\t{\n", "\tfunction logoFunc()\n\t{\n\t\t#if html5\n\t\tfinish();\n\t\treturn;\n\t\t#else\n", 1)
              .replace("\t\tadd(logo);\n", "\t\tadd(logo);\n\t\t#end\n", 1))

          def patch_fnaf(s):
              s = re.sub(r'(?m)^(\s*)Sys\.exit\(0\);$', r'\1#if !html5\n\1Sys.exit(0);\n\1#end', s, count=1)
              old = '''\t\t\t\t\tvar tmp = Sys.getEnv("TEMP");\n\t\t\t\t\tif (tmp == null) tmp = ".";\n\t\t\t\t\tvar dest = tmp + "/fnaf_vid_" + Paths.sanitize(key) + ".mp4";\n\t\t\t\t\tsys.io.File.saveBytes(dest, bytes);\n\t\t\t\t\tloadPath = dest;'''
              new = '''\t\t\t\t\t#if !html5\n''' + old + '''\n\t\t\t\t\t#end'''
              if old in s: s = s.replace(old, new, 1)
              else:
                  s = re.sub(r'(?s)(\s*var tmp = Sys\.getEnv\("TEMP"\);.*?loadPath = dest;)', lambda m: '#if !html5\n' + m.group(1) + '\n#end', s, count=1)
              return s
          edit('source/funkin/states/FNAFState.hx', patch_fnaf)

          edit('source/funkin/objects/menu/CosmicubeNode.hx', lambda s: s.replace('inline function hasUpdogSaveData():Bool\n\t{\n', 'inline function hasUpdogSaveData():Bool\n\t{\n\t\t#if html5\n\t\treturn false;\n\t\t#else\n', 1)
              .replace("\t\treturn FileSystem.isDirectory('$appDataPath/UpdogTeam');\n\t}\n", "\t\treturn FileSystem.isDirectory('$appDataPath/UpdogTeam');\n\t\t#end\n\t}\n", 1))
          PY

      - name: Compile to Web Port
        run: haxelib run lime build html5

      - name: Upload HTML5 Build
        uses: actions/upload-artifact@v4
        with:
          name: impostor-legacy-html5
          path: export/html5/bin
          if-no-files-found: error
          retention-days: 7
