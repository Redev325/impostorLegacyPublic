name: Build HTML5 Web Port
on:
  workflow_dispatch:
  push:
    branches:
      - main
concurrency:
  group: html5-build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential pkg-config libwayland-dev libwayland-bin wayland-protocols libasound2-dev libpulse-dev libdbus-1-dev libudev-dev libx11-dev libxext-dev libxrandr-dev libxinerama-dev libxcursor-dev libxi-dev libxfixes-dev libxxf86vm-dev libxss-dev libxkbcommon-dev libxt-dev libxv-dev libdrm-dev libgbm-dev libgl-dev libgles-dev libegl1-mesa-dev libglu1-mesa-dev libibus-1.0-dev libsamplerate0-dev libsndio-dev libpipewire-0.3-dev libspa-0.2-dev libsdl2-dev
      - name: Setup Haxe Environment
        uses: krdlab/setup-haxe@v1
        with:
          haxe-version: 4.3.6
      - name: Install hxpkg
        run: haxelib install hxpkg --quiet
      - name: Install Project Libraries
        run: |
          haxelib run hxpkg setup
          haxelib run hxpkg install
      - name: Build Lime native tools
        run: |
          cd .haxelib/lime/git
          git submodule sync --recursive
          git submodule update --init --recursive --force
          cd ../../..
          haxelib run lime rebuild cpp -release
      - name: Disable native-only video backend for HTML5
        run: |
          cat > source/funkin/video/FunkinVideoSprite.hx <<'EOF'
          package funkin.video;
          import flixel.FlxSprite;
          class FunkinVideoSprite extends FlxSprite
          {
            public static final looping:String = ':input-repeat=65535';
            public static final muted:String = ':no-audio';
            public var tiedToGame:Bool = true;
            public var time(get, set):Float;
            public var length(get, never):Float;
            public var playing(get, never):Bool;
            public var percent(get, never):Float;
            var _time:Float = 0;
            var _playing:Bool = false;
            public function new(x:Float = 0, y:Float = 0, oneTimeUse:Bool = true) super(x, y);
            public static function init():Void {}
            public function delayAndStart(delay:Float = 0):Void {}
            public function onEnd(func:Void->Void, once:Bool = false, priority:Int = 0):Void {}
            public function onStart(func:Void->Void, once:Bool = false, priority:Int = 0):Void {}
            public function onFormat(func:Void->Void, once:Bool = false, priority:Int = 0):Void {}
            public function load(location:Dynamic, ?options:Array<String>):Bool return false;
            public function play():Void _playing = false;
            public function pause():Void _playing = false;
            public function resume():Void _playing = false;
            public function stop():Void _playing = false;
            inline function get_time():Float return _time;
            inline function set_time(value:Float):Float { _time = value; return value; }
            inline function get_length():Float return 0;
            inline function get_playing():Bool return _playing;
            inline function get_percent():Float return 0;
          }
          EOF
      - name: Apply HTML5 compatibility patches
        run: |
          python3 <<'PY'
          from pathlib import Path
          import re
          def edit(path, fn):
              p = Path(path); s = p.read_text(); out = fn(s)
              if out == s: raise SystemExit(f'No change made to {path}; expected source pattern was not found')
              p.write_text(out)
          edit('source/funkin/Paths.hx', lambda s: s.replace("\tpublic static function getModFolder(path:String, ?exclude:String):String\n", "\t#if html5\n\tpublic static inline function mods(?mod:String = ''):String\n\t{\n\t\treturn MODS_DIRECTORY + '/' + (mod ?? '');\n\t}\n\t#end\n\n\tpublic static function getModFolder(path:String, ?exclude:String):String\n", 1).replace("return (!FileSystem.exists(path) && Assets.exists(path, FONT) ? Assets.getFont(path).fontName : path);", "return (Assets.exists(path, FONT) ? Assets.getFont(path).fontName : path);", 1))
          Path('source/funkin/data/CosmicubeData.hx').write_text('''package funkin.data;\ntypedef CosmicubeMetadata = { var title:String; var ?currency:String; var ?mod:String; var ?fileName:String; }\ntypedef ShopItemData = { var ?requirement:Dynamic; var ?week:String; var ?song:String; var ?completionExcluded:Bool; var type:String; var price:Int; var ?title:String; var ?hint:String; var ?description:String; var node:NodeData; var ?fileName:String; var ?color:Dynamic; var ?icon:String; var ?currency:String; }\nenum ShopRequirement { WEEK(week:String, ?accuracy:Float); SONG(song:String, ?accuracy:Float, ?rank:String); COMPLETION(percent:Float); GLOBAL_COMPLETION(percent:Float); UPDOG_SAVE; SCRIPTED; NONE; }\nclass CosmicubeData {\n public static var currentMeta(get, never):Null<CosmicubeMetadata>; public static var currentCurrency(get, never):String; public static var currentMoney(get, set):Int; public static var cosmicubeList:Array<String> = []; public static var cosmicubeMetas:Map<String,CosmicubeMetadata> = []; public static var cosmicubeItems:Map<String,Array<ShopItemData>> = []; public static var fallbackMeta:CosmicubeMetadata = {title:'Unknown',currency:'beans',fileName:'idk'};\n public static function reload(hard:Bool=true):Void { if(!hard && cosmicubeList.length>0)return; cosmicubeList.resize(0); cosmicubeMetas.clear(); cosmicubeItems.clear(); } static function getShopItems(dir:String, meta:CosmicubeMetadata):Array<ShopItemData> return [];\n inline static function get_currentMeta():CosmicubeMetadata { reload(false); var meta=cosmicubeMetas.get(ClientPrefs.activeCosmicube); return meta==null?fallbackMeta:meta; } inline static function get_currentCurrency():String return currentMeta?.currency ?? ''; static function get_currentMoney():Int return getMoney(currentCurrency); static function set_currentMoney(money:Int):Int return setMoney(currentCurrency,money);\n public static inline function getMoney(currency:Null<String>):Int { if(currency==null||currency.length==0)return 0; if(!ClientPrefs.money.exists(currency))ClientPrefs.money.set(currency,0); return ClientPrefs.money.get(currency); } public static inline function setMoney(currency:Null<String>,money:Int):Int { if(currency==null||currency.length==0)return 0; ClientPrefs.money.set(currency,money); return money; }\n}\n''')
          edit('source/funkin/states/editors/ChartEditorState.hx', lambda s: s.replace('import openfl.events.Event;\n','import openfl.events.Event;\nimport openfl.media.Sound;\n',1).replace("File.getContent(Paths.getCorePath('$path.txt'))","FunkinAssets.getContent(Paths.getCorePath('$path.txt'))",1))
          Path('source/funkin/utils/FileUtil.hx').write_text('''package funkin.utils;\nimport openfl.net.FileFilter;\ntypedef BrowseOptions = { var ?typeFilter:Array<FileFilter>; var ?title:String; var ?defaultSearch:String; }\n@:nullSafety class FileUtil { public static function browseForFile(options:BrowseOptions,?onSelect:String->Void,?onCancel:Void->Void):Void { if(onCancel!=null)onCancel(); } public static function browseForMultipleFiles(options:BrowseOptions,?onSelect:Array<String>->Void,?onCancel:Void->Void):Void { if(onCancel!=null)onCancel(); } public static function saveFile(data:Dynamic,?fileName:String,?onSelect:String->Void,?onCancel:Void->Void):Void { if(onCancel!=null)onCancel(); } public static function saveFileToPath(data:Dynamic,path:String,ensureDirectory:Bool=true):Bool return false; }\n''')
          def replace_function(text,name,replacement):
              m=re.search(r'(?m)^(\s*(?:public\s+)?static\s+function\s+'+re.escape(name)+r'\s*\([^\n]*\)[^\n]*\n)',text)
              if not m: raise SystemExit(f'Could not find function {name}')
              start=m.start(); brace=text.find('{',m.end()-1)
              if brace<0: raise SystemExit(f'Could not find opening brace for {name}')
              depth=0; in_str=None; esc=False; end=None
              for i in range(brace,len(text)):
                  c=text[i]
                  if in_str:
                      if esc: esc=False
                      elif c=='\\': esc=True
                      elif c==in_str: in_str=None
                  else:
                      if c in ('\"',"'"): in_str=c
                      elif c=='{': depth+=1
                      elif c=='}':
                          depth-=1
                          if depth==0: end=i+1; break
              if end is None: raise SystemExit(f'Could not find closing brace for {name}')
              return text[:start]+replacement+text[end:]
          cp=Path('source/funkin/data/ClientPrefs.hx'); s=cp.read_text(); s=replace_function(s,'backupSave',"\tpublic static function backupSave(name:String='funkin'):Void { }\n"); s=replace_function(s,'tryBindingSave',"\tpublic static function tryBindingSave(name:String='funkin'):Void { FlxG.save.bind(name,CoolUtil.getSavePath(),function(data:String,exception:haxe.Exception) { if(exception!=null) trace('save binding failed: ${exception.message}'); return {}; }); }\n"); s=replace_function(s,'attemptLoadBackup',"\tpublic static function attemptLoadBackup(name:String='funkin'):Dynamic { return {}; }\n"); cp.write_text(s)
          mods=Path('source/funkin/Mods.hx'); s=mods.read_text(); s=re.sub(r'(?m)^\s*File\.saveContent\([^\n]*\);\s*$','\t// modsList.txt saving disabled for HTML5',s); s=s.replace('FileSystem.exists(path + fileToFind)','FunkinAssets.exists(path + fileToFind)'); mods.write_text(s)
          fnaf=Path('source/funkin/states/FNAFState.hx'); s=fnaf.read_text(); s=s.replace('Sys.exit(0);','// browser build does not terminate the process'); s=s.replace('var tmp = Sys.getEnv("TEMP");','var tmp = ".";'); s=s.replace('sys.io.File.saveBytes(dest, bytes);','// native video file write disabled for browser'); leftovers=[x for x in ('Sys.getEnv("TEMP")','sys.io.File.saveBytes','Sys.exit(0);') if x in s]
          if leftovers: raise SystemExit('FNAF native code still present: '+', '.join(leftovers))
          fnaf.write_text(s)
          edit('source/funkin/backend/CrashHandler.hx', lambda s: s.replace('final cl = Type.getClass(FlxG.state);','final cl:Null<Class<Dynamic>> = null;',1))
          edit('source/funkin/backend/DebugDisplay.hx', lambda s: s.replace('var className = Type.getClassName(Type.getClass(FlxG.state));','var className:String = \'Unknown\';',1))
          edit('source/funkin/data/ClientPrefs.hx',lambda s:s.replace('funkin.api.DiscordClient.check();','// Discord RPC disabled for HTML5'))
          # Init.hx already contains the HTML5-safe Discord change in the repository; do not fail if there is nothing left to patch.
          init_path=Path('source/Init.hx')
          init_text=init_path.read_text()
          init_new=init_text.replace('DiscordClient.check();','// Discord RPC disabled for HTML5')
          if init_new != init_text: init_path.write_text(init_new)
          # Lime marks every HTML5 font as preload=true by default, even when its
          # asset library is explicitly deferred. Make the generated manifest respect
          # the library preload flag so the large deferred fonts library stays deferred.
          lime_asset_helper = next(
              (p for p in Path('.haxelib/lime').rglob('AssetHelper.hx')
               if p.as_posix().endswith('/src/lime/tools/AssetHelper.hx')),
              None
          )
          if lime_asset_helper is None:
              raise SystemExit('Could not find Lime AssetHelper.hx')
          lime_text = lime_asset_helper.read_text()
          lime_old = '''\t\t\tif (asset.type == AssetType.FONT)
\t\t\t{
\t\t\t\tassetData.className = "__ASSET__" + asset.flatName;
\t\t\t\tassetData.preload = true;
\t\t\t}
\t\t\telse'''
          lime_new = '''\t\t\tif (asset.type == AssetType.FONT)
\t\t\t{
\t\t\t\tassetData.className = "__ASSET__" + asset.flatName;
\t\t\t\tif (asset.library != null && libraries.exists(asset.library))
\t\t\t\t{
\t\t\t\t\tassetData.preload = libraries[asset.library].preload;
\t\t\t\t}
\t\t\t\telse if (libraries.exists(DEFAULT_LIBRARY_NAME))
\t\t\t\t{
\t\t\t\t\tassetData.preload = libraries[DEFAULT_LIBRARY_NAME].preload;
\t\t\t\t}
\t\t\t}
\t\t\telse'''
          if lime_old not in lime_text:
              raise SystemExit('Expected Lime HTML5 font preload block was not found')
          lime_asset_helper.write_text(lime_text.replace(lime_old, lime_new, 1))
          print(f'Patched {lime_asset_helper}')
          edit('source/funkin/utils/CoolUtil.hx',lambda s:s.replace('FlxG.error("Platform is not supported for CoolUtil.openFolder");','trace("Platform is not supported for CoolUtil.openFolder");'))
          edit('source/Splash.hx',lambda s:re.sub(r'(?s)(\tfunction logoFunc\(\)\n\t\{).*?(\n\t\}\n)',r'\1\n\t\tfinish();\n\t\2',s,count=1))
          edit('source/funkin/objects/menu/CosmicubeNode.hx',lambda s:re.sub(r'(?s)(inline function hasUpdogSaveData\(\):Bool\n\t\{).*?(\n\t\}\n)',r'\1\n\t\treturn false;\n\t\2',s,count=1))
          PY
      - name: Verify HTML5 compatibility patches
        run: |
          set -e
          ! grep -R -n -E '^[[:space:]]*(sys\.io\.File|Sys\.getEnv|Sys\.exit\(|FileSystem\.(exists|deleteFile|rename)|File\.(copy|saveContent))' source/funkin/data/ClientPrefs.hx source/funkin/Mods.hx source/funkin/states/FNAFState.hx
          ! grep -R -n -E 'Sys\.getEnv\("TEMP"\)|sys\.io\.File\.saveBytes|Sys\.exit\(0\);' source/funkin/states/FNAFState.hx
          ! grep -R -n -E 'Type\.getClass\(FlxG\.state\)|Type\.getClassName\(Type\.getClass\(FlxG\.state\)\)' source/funkin/backend/CrashHandler.hx source/funkin/backend/DebugDisplay.hx
      - name: Setup Java for production web compilation
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Compile to Web Port
        run: |
          haxelib run lime build html5 -final
      - name: Make Lean HTML5 Package
        shell: bash
        run: |
          set -e
          OUTPUT_DIR="export/release/html5/bin"
          test -f "$OUTPUT_DIR/index.html"
          test -f "$OUTPUT_DIR/ImpostorLegacy.js"
          echo "Removing video files that cannot be used by the HTML5 build..."
          find "$OUTPUT_DIR" -type f \( -iname '*.mp4' -o -iname '*.webm' -o -iname '*.mkv' -o -iname '*.avi' -o -iname '*.mov' -o -iname '*.wmv' \) -delete
          rm -f "$OUTPUT_DIR/CHANGELOG.md"
          echo "Lean package size:"
          du -sh "$OUTPUT_DIR"
      - name: Inspect generated HTML5 asset manifests
        shell: bash
        run: |
          set -e
          OUTPUT_DIR="export/release/html5/bin"
          echo "===== GENERATED MANIFESTS ====="
          find "$OUTPUT_DIR/manifest" -maxdepth 1 -type f -name '*.json' -printf '%f\t%s bytes\n' 2>/dev/null | sort || true
          python3 - "$OUTPUT_DIR" <<'PY'
          import json
          import sys
          from pathlib import Path
          root = Path(sys.argv[1])
          manifest_dir = root / 'manifest'
          for path in sorted(manifest_dir.glob('*.json')) if manifest_dir.exists() else []:
              try:
                  data = json.loads(path.read_text())
              except Exception as e:
                  print(f'Could not parse {path.name}: {e}')
                  continue
              assets = data if isinstance(data, list) else data.get('assets', []) if isinstance(data, dict) else []
              rows = []
              for item in assets if isinstance(assets, list) else []:
                  if not isinstance(item, dict):
                      continue
                  size = int(item.get('size', 0) or 0)
                  name = item.get('id') or item.get('path') or item.get('src') or '?'
                  rows.append((size, name))
              print(f'{path.name}: entries={len(rows)} declared_bytes={sum(size for size, _ in rows)}')
              if path.name == 'default.json':
                  print('===== DEFAULT MANIFEST LARGEST DECLARED ASSETS =====')
                  for size, name in sorted(rows, reverse=True)[:100]:
                      print(f'{size}\t{name}')
          PY
      - name: Diagnose HTML5 preloader asset checkpoints
        shell: bash
        run: |
          set -euo pipefail
          OUTPUT_DIR="export/release/html5/bin"
          MANIFEST_DIR="$OUTPUT_DIR/manifest"

          echo "===== PROJECT LIBRARY PRELOAD FLAGS ====="
          grep -nE '<library name=.*preload=' Project.xml || true

          echo "===== DECODED HTML5 ASSET MANIFESTS ====="
          LIME_MANIFEST="$(find .haxelib/lime -type f -path '*/src/lime/utils/AssetManifest.hx' -print -quit 2>/dev/null || true)"
          if [ -z "$LIME_MANIFEST" ]; then
            echo "ERROR: Could not find Lime AssetManifest.hx for manifest decoding."
            find .haxelib/lime -type f -name AssetManifest.hx -print || true
            exit 1
          fi
          LIME_SRC="$(printf '%s' "$LIME_MANIFEST" | sed 's#/lime/utils/AssetManifest\.hx$##')"
          echo "Using Lime sources: $LIME_SRC"
          echo "Using AssetManifest: $LIME_MANIFEST"

          cat > /tmp/ManifestInspector.hx <<'HX'
          import haxe.io.Path;
          import sys.FileSystem;
          import sys.io.File;
          import lime.utils.AssetManifest;

          class ManifestInspector
          {
            static function clean(value:Dynamic):String
            {
              if (value == null) return "";
              return StringTools.replace(StringTools.replace(Std.string(value), "\\t", "\\\\t"), "\\n", "\\\\n");
            }

            static function field(asset:Dynamic, name:String):String
            {
              return Reflect.hasField(asset, name) ? clean(Reflect.field(asset, name)) : "";
            }

            static function main():Void
            {
              final dir = Sys.args()[0];
              var files = FileSystem.readDirectory(dir);
              files.sort(Reflect.compare);
              for (file in files)
              {
                if (!StringTools.endsWith(file, ".json")) continue;
                final full = Path.join([dir, file]);
                try
                {
                  final manifest:AssetManifest = AssetManifest.parse(File.getContent(full), "");
                  Sys.println("MANIFEST\\t" + file + "\\t" + clean(manifest.name) + "\\t" + manifest.assets.length);
                  for (index in 0...manifest.assets.length)
                  {
                    final asset = manifest.assets[index];
                    Sys.println("ASSET\\t" + file + "\\t" + index + "\\t" +
                      field(asset, "id") + "\\t" + field(asset, "path") + "\\t" +
                      field(asset, "type") + "\\t" + field(asset, "size") + "\\t" +
                      field(asset, "preload") + "\\t" + field(asset, "embed") + "\\t" +
                      field(asset, "group"));
                  }
                }
                catch (e:Dynamic)
                {
                  Sys.println("ERROR\\t" + file + "\\t" + clean(e));
                }
              }
            }
          }
          HX

          haxe -cp /tmp -cp "$LIME_SRC" -main ManifestInspector -neko /tmp/ManifestInspector.n
          neko /tmp/ManifestInspector.n "$MANIFEST_DIR" > /tmp/manifest-report.tsv

          echo "===== GENERATED PRELOADER LIBRARY REGISTRATION ====="
          PRELOADER_FILES="$(find export/release/html5 -type f \( -name 'ManifestResources.hx' -o -name 'ApplicationMain.hx' \) -print 2>/dev/null | sort || true)"
          if [ -n "$PRELOADER_FILES" ]; then
            printf '%s\n' "$PRELOADER_FILES"
            while IFS= read -r file; do
              echo "--- $file ---"
              grep -nE 'preloadLibraries|preloadLibraryNames|addLibrary(Name)?\(' "$file" || true
            done <<< "$PRELOADER_FILES"
          else
            echo "No generated ManifestResources.hx/ApplicationMain.hx files found."
            find export/release/html5 -maxdepth 5 -type f \( -name '*.hx' -o -name '*.json' \) -print 2>/dev/null | head -100 || true
          fi

          echo "===== MANIFEST SUMMARY ====="
          awk -F '\\t' '$1 == "MANIFEST" {printf "%s: %s assets\\n", $2, $4}' /tmp/manifest-report.tsv

          echo "===== PRELOAD BYTE CHECKPOINTS ====="
          python3 - "$OUTPUT_DIR" /tmp/manifest-report.tsv <<'PY'
          import sys
          from pathlib import Path

          root = Path(sys.argv[1])
          report = Path(sys.argv[2])
          rows_by_manifest = {}
          errors = []

          for line in report.read_text().splitlines():
              parts = line.split("\\t")
              if not parts: continue
              if parts[0] == "ERROR":
                  errors.append(parts)
                  continue
              if parts[0] != "ASSET" or len(parts) < 10:
                  continue
              manifest, index, asset_id, path, typ, size, preload, embed, group = parts[1:10]
              try: size_i = int(size or 0)
              except ValueError: size_i = 0
              rows_by_manifest.setdefault(manifest, []).append({
                  "index": int(index), "id": asset_id, "path": path, "type": typ,
                  "size": size_i, "preload": preload.lower() == "true", "embed": embed.lower() == "true", "group": group
              })

          for manifest, rows in sorted(rows_by_manifest.items()):
              active = [r for r in rows if r["preload"]]
              if not active:
                  continue
              total = sum(r["size"] for r in active)
              print(f"--- {manifest}: {len(active)} preload-flagged assets, declared bytes={total} ---")
              if total <= 0:
                  print("WARNING: preload-flagged assets have zero declared total bytes")
                  continue
              for checkpoint in (6, 42, 49, 73):
                  target = total * checkpoint / 100.0
                  cumulative = 0
                  chosen = active[-1]
                  for r in active:
                      cumulative += r["size"]
                      if cumulative >= target:
                          chosen = r
                          break
                  start = max(0, cumulative - chosen["size"])
                  lo = start / total * 100 if total else 0
                  hi = cumulative / total * 100 if total else 0
                  print(f"CHECKPOINT {checkpoint}% -> asset {chosen['index']} | {chosen['id']} | {chosen['path']} | {chosen['type']} | {chosen['size']} bytes | cumulative {lo:.1f}%..{hi:.1f}%")

          print("===== TOP PRELOAD-FLAGGED ASSETS BY DECLARED SIZE =====")
          all_active = []
          for manifest, rows in rows_by_manifest.items():
              for r in rows:
                  if r["preload"]:
                      all_active.append((r["size"], manifest, r))
          print("===== GLOBAL PRELOAD BYTE CHECKPOINTS (MANIFEST/ASSET ORDER) =====")
          global_active = []
          for manifest, rows in rows_by_manifest.items():
              for r in rows:
                  if r["preload"]:
                      global_active.append((manifest, r))
          global_total = sum(r["size"] for _, r in global_active)
          print(f"Global preload-flagged bytes: {global_total}")
          if global_total > 0:
              for checkpoint in (6, 42, 49, 73):
                  target = global_total * checkpoint / 100.0
                  cumulative = 0
                  chosen_manifest, chosen = global_active[-1]
                  for manifest, r in global_active:
                      cumulative += r["size"]
                      if cumulative >= target:
                          chosen_manifest, chosen = manifest, r
                          break
                  start = max(0, cumulative - chosen["size"])
                  lo = start / global_total * 100.0
                  hi = cumulative / global_total * 100.0
                  print(
                      f"GLOBAL CHECKPOINT {checkpoint}% -> {chosen_manifest} | "
                      f"asset {chosen['index']} | {chosen['id']} | {chosen['path']} | "
                      f"{chosen['type']} | {chosen['size']} bytes | cumulative {lo:.1f}%..{hi:.1f}%"
                  )

          print("===== TOP PRELOAD-FLAGGED ASSETS BY DECLARED SIZE =====")
          for size, manifest, r in sorted(
              all_active,
              key=lambda item: (item[0], item[1], item[2]["index"]),
              reverse=True
          )[:100]:
              print(f"{size}\t{manifest}\t{r['id']}\t{r['path']}\t{r['type']}\tpreload={str(r['preload']).lower()}\tembed={str(r['embed']).lower()}")

          print("===== SUSPICIOUS PRELOAD-FLAGGED ASSETS =====")
          suspicious = 0
          for manifest, rows in sorted(rows_by_manifest.items()):
              for r in rows:
                  if not r["preload"]: continue
                  rel = (r["path"] or r["id"] or "").lstrip("./")
                  if not rel or rel == "CHANGELOG.md":
                      continue
                  actual = root / rel
                  if not actual.exists() or not actual.is_file():
                      print(f"MISSING\t{manifest}\t{r['id']}\t{rel}")
                      suspicious += 1
                  else:
                      actual_size = actual.stat().st_size
                      if actual_size == 0:
                          print(f"ZERO_BYTES\t{manifest}\t{r['id']}\t{rel}")
                          suspicious += 1
                      elif r["size"] and actual_size != r["size"]:
                          print(f"SIZE_MISMATCH\t{manifest}\t{r['id']}\t{rel}\tdeclared={r['size']}\tactual={actual_size}")
                          suspicious += 1
          if suspicious == 0:
              print("No missing, zero-byte, or declared-size-mismatch preload assets found.")
          if errors:
              print("===== MANIFEST PARSE ERRORS =====")
              for parts in errors:
                  print("\\t".join(parts))
          PY

      - name: Report largest HTML5 assets after cleanup
        shell: bash
        run: |
          set -e
          OUTPUT_DIR="export/release/html5/bin"
          python3 - "$OUTPUT_DIR" <<'PY'
          import os
          import sys
          from pathlib import Path
          root = Path(sys.argv[1])
          files = []
          for p in root.rglob('*'):
              if p.is_file():
                  try: files.append((p.stat().st_size, str(p)))
                  except OSError: pass
          files.sort(reverse=True)
          print('===== TOP 100 LARGEST HTML5 FILES AFTER CLEANUP =====')
          for size, path in files[:100]: print(f'{size}\t{path}')
          print('===== SIZE BY TOP-LEVEL DIRECTORY AFTER CLEANUP =====')
          entries = []
          for p in root.iterdir():
              try:
                  size = p.stat().st_size if p.is_file() else sum(x.stat().st_size for x in p.rglob('*') if x.is_file())
                  entries.append((size, str(p)))
              except OSError: pass
          entries.sort(reverse=True)
          for size, path in entries[:50]: print(f'{size}\t{path}')
          PY
      - name: Verify HTML5 build output
        shell: bash
        run: |
          set -e
          OUTPUT_DIR="export/release/html5/bin"
          echo "Checking generated HTML5 output at: $OUTPUT_DIR"
          if [ ! -d "$OUTPUT_DIR" ]; then
            echo "ERROR: Expected HTML5 output directory was not created: $OUTPUT_DIR"
            find export -maxdepth 5 -type d -print
            exit 1
          fi
          if [ ! -f "$OUTPUT_DIR/index.html" ]; then echo "ERROR: index.html is missing from $OUTPUT_DIR"; exit 1; fi
          if [ ! -f "$OUTPUT_DIR/ImpostorLegacy.js" ]; then echo "ERROR: ImpostorLegacy.js is missing from $OUTPUT_DIR"; exit 1; fi
          echo "HTML5 build output verified successfully."
      - name: Upload HTML5 Build
        uses: actions/upload-artifact@v4
        with:
          name: impostor-legacy-html5-lean
          path: export/release/html5/bin
          if-no-files-found: error
          retention-days: 7
