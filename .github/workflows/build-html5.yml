name: Build HTML5 Web Port
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential libwayland-dev libwayland-bin wayland-protocols libasound2-dev pkg-config

      - name: Setup Haxe Environment
        uses: krdlab/setup-haxe@v1
        with:
          haxe-version: 4.3.6

      - name: Install hxpkg
        run: haxelib install hxpkg --quiet

      - name: Install Project Libraries
        run: |
          haxelib run hxpkg setup
          haxelib run hxpkg install

      - name: Build Lime native tools
        run: |
          cd .haxelib/lime/git
          git submodule sync --recursive
          git submodule update --init --recursive --force
          cd ../../..
          haxelib run lime rebuild cpp -release

      - name: Compile to Web Port
        run: haxelib run lime build html5

      - name: Upload HTML5 Build
        uses: actions/upload-artifact@v4
        with:
          name: impostor-legacy-html5
          path: export/html5/bin
          if-no-files-found: error
          retention-days: 7
