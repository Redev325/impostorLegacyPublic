name: Build HTML5 Web Port (Fixed)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential pkg-config libwayland-dev libwayland-bin wayland-protocols \
            libasound2-dev libpulse-dev libdbus-1-dev libudev-dev \
            libx11-dev libxext-dev libxrandr-dev libxinerama-dev libxcursor-dev \
            libxi-dev libxfixes-dev libxxf86vm-dev libxss-dev libxkbcommon-dev \
            libxt-dev libxv-dev libdrm-dev libgbm-dev libgl-dev libgles-dev \
            libegl1-mesa-dev libglu1-mesa-dev libibus-1.0-dev libsamplerate0-dev \
            libsndio-dev libpipewire-0.3-dev libspa-0.2-dev libsdl2-dev

      - name: Setup Haxe Environment
        uses: krdlab/setup-haxe@v1
        with:
          haxe-version: 4.3.6

      - name: Install hxpkg
        run: haxelib install hxpkg --quiet

      - name: Install Project Libraries
        run: |
          haxelib run hxpkg setup
          haxelib run hxpkg install

      - name: Build Lime native tools
        run: |
          cd .haxelib/lime/git
          git submodule sync --recursive
          git submodule update --init --recursive --force
          cd ../../..
          haxelib run lime rebuild cpp -release

      - name: Disable native-only video backend for HTML5
        run: |
          cat > source/funkin/video/FunkinVideoSprite.hx <<'EOF'
          package funkin.video;
          import flixel.FlxSprite;
          class FunkinVideoSprite extends FlxSprite
          {
            public static final looping:String = ':input-repeat=65535';
            public static final muted:String = ':no-audio';
            public var tiedToGame:Bool = true;
            public var time(get, set):Float;
            public var length(get, never):Float;
            public var playing(get, never):Bool;
            public var percent(get, never):Float;
            var _time:Float = 0;
            var _playing:Bool = false;
            public function new(x:Float = 0, y:Float = 0, oneTimeUse:Bool = true) super(x, y);
            public static function init():Void {}
            public function delayAndStart(delay:Float = 0):Void {}
            public function onEnd(func:Void->Void, once:Bool = false, priority:Int = 0):Void {}
            public function onStart(func:Void->Void, once:Bool = false, priority:Int = 0):Void {}
            public function onFormat(func:Void->Void, once:Bool = false, priority:Int = 0):Void {}
            public function load(location:Dynamic, ?options:Array<String>):Bool return false;
            public function play():Void _playing = false;
            public function pause():Void _playing = false;
            public function resume():Void _playing = false;
            public function stop():Void _playing = false;
            inline function get_time():Float return _time;
            inline function set_time(value:Float):Float { _time = value; return value; }
            inline function get_length():Float return 0;
            inline function get_playing():Bool return _playing;
            inline function get_percent():Float return 0;
          }
          EOF

      - name: Apply HTML5 compatibility patches
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path
          import re

          def replace_required(path, old, new):
              p = Path(path)
              s = p.read_text()
              if old not in s:
                  raise SystemExit(f'Expected source text not found in {path}: {old[:100]!r}')
              p.write_text(s.replace(old, new))
              print(f'Patched {path}')

          # Paths: web-safe mods path and font lookup.
          replace_required('source/funkin/Paths.hx',
              "return (!FileSystem.exists(path) && Assets.exists(path, FONT) ? Assets.getFont(path).fontName : path);",
              "return (Assets.exists(path, FONT) ? Assets.getFont(path).fontName : path);")
          p = Path('source/funkin/Paths.hx')
          s = p.read_text()
          if '#if html5\n\tpublic static inline function mods' not in s:
              marker = "\tpublic static function getModFolder(path:String, ?exclude:String):String\n"
              if marker not in s:
                  raise SystemExit('Could not find Paths.getModFolder')
              s = s.replace(marker, "\t#if html5\n\tpublic static inline function mods(?mod:String = ''):String\n\t{\n\t\treturn MODS_DIRECTORY + '/' + (mod ?? '');\n\t}\n\t#end\n\n" + marker, 1)
              p.write_text(s)

          # Cosmicube data is filesystem-based on desktop; keep its public API on web.
          Path('source/funkin/data/CosmicubeData.hx').write_text('''package funkin.data;

typedef CosmicubeMetadata =
{
  var title:String;
  var ?currency:String;
  var ?mod:String;
  var ?fileName:String;
}

typedef ShopItemData =
{
  var ?requirement:Dynamic;
  var ?week:String;
  var ?song:String;
  var ?completionExcluded:Bool;
  var type:String;
  var price:Int;
  var ?title:String;
  var ?hint:String;
  var ?description:String;
  var node:Dynamic;
  var ?fileName:String;
  var ?color:Dynamic;
  var ?icon:String;
  var ?currency:String;
}

enum ShopRequirement
{
  WEEK(week:String, ?accuracy:Float);
  SONG(song:String, ?accuracy:Float, ?rank:String);
  COMPLETION(percent:Float);
  GLOBAL_COMPLETION(percent:Float);
  UPDOG_SAVE;
  SCRIPTED;
  NONE;
}

class CosmicubeData
{
  public static var currentMeta(get, never):Null<CosmicubeMetadata>;
  public static var currentCurrency(get, never):String;
  public static var currentMoney(get, set):Int;
  public static var cosmicubeList:Array<String> = [];
  public static var cosmicubeMetas:Map<String, CosmicubeMetadata> = [];
  public static var cosmicubeItems:Map<String, Array<ShopItemData>> = [];
  public static var fallbackMeta:CosmicubeMetadata = {title: 'Unknown', currency: 'beans', fileName: 'idk'};

  public static function reload(hard:Bool = true):Void
  {
    if (!hard && cosmicubeList.length > 0) return;
    cosmicubeList.resize(0);
    cosmicubeMetas.clear();
    cosmicubeItems.clear();
  }

  static function getShopItems(dir:String, meta:CosmicubeMetadata):Array<ShopItemData> return [];

  inline static function get_currentMeta():CosmicubeMetadata
  {
    reload(false);
    var meta = cosmicubeMetas.get(ClientPrefs.activeCosmicube);
    return meta == null ? fallbackMeta : meta;
  }

  inline static function get_currentCurrency():String return currentMeta?.currency ?? '';
  static function get_currentMoney():Int return getMoney(currentCurrency);
  static function set_currentMoney(money:Int):Int return setMoney(currentCurrency, money);

  public static inline function getMoney(currency:Null<String>):Int
  {
    if (currency == null || currency.length == 0) return 0;
    if (!ClientPrefs.money.exists(currency)) ClientPrefs.money.set(currency, 0);
    return ClientPrefs.money.get(currency);
  }

  public static inline function setMoney(currency:Null<String>, money:Int):Int
  {
    if (currency == null || currency.length == 0) return 0;
    ClientPrefs.money.set(currency, money);
    return money;
  }
}
''')

          # Chart editor: browser assets instead of sys.io.File.
          p = Path('source/funkin/states/editors/ChartEditorState.hx')
          s = p.read_text()
          if 'import openfl.media.Sound;' not in s:
              s = s.replace('import openfl.events.Event;\n', 'import openfl.events.Event;\nimport openfl.media.Sound;\n', 1)
          s = s.replace("File.getContent(Paths.getCorePath('$path.txt'))", "FunkinAssets.getContent(Paths.getCorePath('$path.txt'))")
          p.write_text(s)

          Path('source/funkin/utils/FileUtil.hx').write_text('''package funkin.utils;
import openfl.net.FileFilter;
typedef BrowseOptions = { var ?typeFilter:Array<FileFilter>; var ?title:String; var ?defaultSearch:String; }
@:nullSafety class FileUtil
{
  public static function browseForFile(options:BrowseOptions, ?onSelect:String->Void, ?onCancel:Void->Void):Void { if (onCancel != null) onCancel(); }
  public static function browseForMultipleFiles(options:BrowseOptions, ?onSelect:Array<String>->Void, ?onCancel:Void->Void):Void { if (onCancel != null) onCancel(); }
  public static function saveFile(data:Dynamic, ?fileName:String, ?onSelect:String->Void, ?onCancel:Void->Void):Void { if (onCancel != null) onCancel(); }
  public static function saveFileToPath(data:Dynamic, path:String, ensureDirectory:Bool = true):Bool return false;
}
''')

          # ClientPrefs backup/corruption recovery uses desktop .sol files. Replace the
          # entire three helper functions with harmless web implementations so no native
          # filesystem symbols remain and no dangling if-statements are produced.
          p = Path('source/funkin/data/ClientPrefs.hx')
          s = p.read_text()
          pattern = r'\tpublic static function backupSave\(name:String = \'funkin\'\):Void.*?\n\t/\*\*\n'
          replacement = '''\tpublic static function backupSave(name:String = 'funkin'):Void
\t{
\t\t// Desktop save-file backups are unavailable in HTML5.
\t}

\tpublic static function tryBindingSave(name:String = 'funkin'):Void
\t{
\t\tFlxG.save.bind(name, CoolUtil.getSavePath(), function(data:String, exception:haxe.Exception) {
\t\t\ttrace('save binding failed: ${exception.message}');
\t\t\treturn {};
\t\t});
\t}

\tpublic static function attemptLoadBackup(name:String = 'funkin'):Dynamic
\t{
\t\treturn {};
\t}
\t
\t/**
'''
          out, count = re.subn(pattern, replacement, s, count=1, flags=re.S)
          if count != 1:
              raise SystemExit('Could not replace ClientPrefs desktop backup functions')
          p.write_text(out)
          print('Patched ClientPrefs.hx')

          # Discord RPC is native-only.
          replace_required('source/Init.hx', 'DiscordClient.check();', '// Discord RPC disabled for HTML5')
          p = Path('source/funkin/utils/CoolUtil.hx')
          s = p.read_text().replace('FlxG.error("Platform is not supported for CoolUtil.openFolder");', 'trace("Platform is not supported for CoolUtil.openFolder");')
          p.write_text(s)

          # Mods list is not writable from the browser.
          p = Path('source/funkin/Mods.hx')
          s = p.read_text()
          s = re.sub(r'(?m)^\s*File\.saveContent\([^;]*\);\s*$', '\t// modsList.txt saving disabled for HTML5', s)
          s = s.replace('FileSystem.exists(path + fileToFind)', 'FunkinAssets.exists(path + fileToFind)')
          p.write_text(s)

          # Splash branding scan uses native filesystem APIs.
          p = Path('source/Splash.hx')
          s = p.read_text()
          pattern = r'(\tfunction logoFunc\(\)\n\t\{).*?(\n\t\}\n)'
          out, count = re.subn(pattern, r'\1\n\t\tfinish();\n\t\2', s, count=1, flags=re.S)
          if count != 1:
              raise SystemExit('Could not patch Splash.logoFunc')
          p.write_text(out)

          # FNAF video extraction uses TEMP and sys.io.File on desktop only.
          p = Path('source/funkin/states/FNAFState.hx')
          s = p.read_text()
          s = s.replace('Sys.exit(0);', '// process exit disabled for HTML5')
          native_block = '''\t\t\t\tvar tmp = Sys.getEnv("TEMP");
\t\t\t\tif (tmp == null) tmp = ".";
\t\t\t\tvar dest = tmp + "/fnaf_vid_" + Paths.sanitize(key) + ".mp4";
\t\t\t\tsys.io.File.saveBytes(dest, bytes);
\t\t\t\tloadPath = dest;'''
          if native_block in s:
              s = s.replace(native_block, '\t\t\t\t// Native temporary video extraction disabled for HTML5.\n\t\t\t\tloadPath = null;', 1)
          else:
              s = re.sub(r'\s*var tmp = Sys\.getEnv\("TEMP"\);.*?loadPath = dest;', '\n\t\t\t\t// Native temporary video extraction disabled for HTML5.\n\t\t\t\tloadPath = null;', s, count=1, flags=re.S)
          p.write_text(s)

          # Cosmicube node save-file probe is unavailable on web.
          p = Path('source/funkin/objects/menu/CosmicubeNode.hx')
          s = p.read_text()
          pattern = r'(inline function hasUpdogSaveData\(\):Bool\n\t\{).*?(\n\t\}\n)'
          out, count = re.subn(pattern, r'\1\n\t\treturn false;\n\t\2', s, count=1, flags=re.S)
          if count != 1:
              raise SystemExit('Could not patch CosmicubeNode.hasUpdogSaveData')
          p.write_text(out)
          PY

      - name: Verify no native-only symbols remain in HTML5 source
        run: |
          ! grep -R -n -E 'sys\.io\.File|Sys\.getEnv|Sys\.exit\(|FileSystem\.(exists|deleteFile|rename)|File\.(copy|saveContent)' source/funkin/data/ClientPrefs.hx source/funkin/Mods.hx source/funkin/states/FNAFState.hx

      - name: Compile to Web Port
        run: haxelib run lime build html5

      - name: Upload HTML5 Build
        uses: actions/upload-artifact@v4
        with:
          name: impostor-legacy-html5
          path: export/html5/bin
          if-no-files-found: error
          retention-days: 7
